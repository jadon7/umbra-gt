<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover：画面铺到刘海和圆角后面；不许双指缩放（开车时两只手都在屏幕上） -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="description" content="UMBRA GT：浏览器里的 3D 街头赛车游戏。两条赛道，八款车，会漂移。" />
    <!-- 装到手机主屏幕上（PWA）：全屏、横屏 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UMBRA GT" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>UMBRA GT</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <!-- 所有画面和界面都在 #app 里：手机竖着拿的时候它整个转九十度，游戏永远是横屏的（见 src/core/viewport.ts） -->
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <div id="hud"></div>
      <div id="loading">
        <div class="loading-inner">
          <div class="loading-title">UMBRA<span>GT</span></div>
          <div class="loading-bar"><i id="loading-fill"></i></div>
          <div class="loading-text" id="loading-text">正在进入车库…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
